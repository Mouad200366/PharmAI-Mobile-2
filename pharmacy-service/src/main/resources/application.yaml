server:
  port: 8082

spring:
  application:
    name: pharmacy-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/pharmacy_mobile_db}
    username: ${SPRING_DATASOURCE_USERNAME:pharmacy_user}
    password: ${SPRING_DATASOURCE_PASSWORD:pharmacy_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: TRACE